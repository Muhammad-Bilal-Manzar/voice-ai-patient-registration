<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareCloud Patient Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f7fa; }
    h1 { color: #1a365d; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th { background: #2b6cb0; color: white; padding: 12px; text-align: left; }
    td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
    tr:last-child td { border-bottom: none; }
    .empty { padding: 2rem; text-align: center; color: #718096; }
  </style>
</head>
<body>
  <h1>🏥 Patient Registration Dashboard</h1>
  <p>This page fetches from <code>GET /patients</code> on the same server.</p>

  <table id="patient-table">
    <thead>
      <tr>
        <th>Name</th><th>DOB</th><th>Phone</th><th>City</th><th>State</th><th>Created</th>
      </tr>
    </thead>
    <tbody id="patient-body"></tbody>
  </table>

  <script>
    // Simple fetch to our own API. The API returns { data: [...], error: null }.
    async function loadPatients() {
      const res = await fetch('/patients');
      const json = await res.json();
      const tbody = document.getElementById('patient-body');

      if (!json.data || json.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No patients registered yet. Call the number to add one!</td></tr>';
        return;
      }

      tbody.innerHTML = json.data.map(p => `
        <tr>
          <td>${p.first_name} ${p.last_name}</td>
          <td>${p.date_of_birth}</td>
          <td>${p.phone_number}</td>
          <td>${p.city}</td>
          <td>${p.state}</td>
          <td>${new Date(p.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    loadPatients();
    // Refresh every 10 seconds to show new registrations live.
    setInterval(loadPatients, 10000);
  </script>
</body>
</html>
